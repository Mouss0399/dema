<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lekk bi — ma journée</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="Ma journée — Lekk bi">
<meta property="og:description" content="Espace traiteur.">
<link rel="preload" href="polices/karla.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="marque/icone-192.png">
<link rel="apple-touch-icon" href="marque/icone-180.png">
<style>
/* Karla, version variable : un seul fichier de 31 Ko pour toutes les graisses
   de 200 a 800, servi depuis ce depot. Remplace les sept fichiers et les deux
   connexions vers Google : la page s'affiche sans dependre d'un tiers, et sans
   rien a laisser passer pour le reseau d'une entreprise.
   Licence SIL OFL 1.1 — voir polices/KARLA-LICENCE.txt */
@font-face{
  font-family:"Karla";
  src:url("polices/karla.woff2") format("woff2-variations"),
      url("polices/karla.woff2") format("woff2");
  font-weight:200 800;
  font-style:normal;
  font-display:swap;
}
:root{
  --paper:#FAF7F2; --surface:#FFFFFF; --surface-2:#F2EDE5; --surface-3:#E9E2D7;
  --line:#E3DACE; --line-strong:#C9BCA9;
  --ink:#241C18; --ink-2:#5A4C43; --ink-3:#8B7B6E;
  --accent:#A3123C; --accent-soft:#F7E3E9; --on-accent:#FFFFFF;
  --good:#1F6B4A; --good-soft:#E2F0E9;
  --warn:#9A5B06; --warn-soft:#FBEBD5;
  --display:"Karla",ui-sans-serif,system-ui,sans-serif;
  --body:"Karla",ui-sans-serif,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#15120F; --surface:#1E1A16; --surface-2:#272119; --surface-3:#322A21;
  --line:#352D24; --line-strong:#4B4035;
  --ink:#F3EDE5; --ink-2:#C3B6A8; --ink-3:#95877A;
  --accent:#F2456F; --accent-soft:#3A1722; --on-accent:#1B0A11;
  --good:#6FCFA2; --good-soft:#12291F;
  --warn:#E5A851; --warn-soft:#2E2113;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);
  padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}

.wrap{max-width:560px;margin:0 auto;padding-inline:16px}
.top{border-bottom:1px solid var(--line);padding-block:14px 12px}
.brand{display:flex;align-items:center;gap:8px;
  font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.01em}
.brand span{color:var(--accent)}

/* ------------------------------------------------------------------
   La marque. Le logotype est un SVG en ligne : aucune requete reseau,
   net a toute taille, et il prend les couleurs du theme tout seul.
   Le point du i est le signe de Lekk bi — plein au repos.
   ------------------------------------------------------------------ */
.brand .logo{width:86px;flex:none}
.logo{display:block;height:auto;width:100%;
  --logo-ink:var(--ink);--logo-accent:var(--accent)}
.when{font-size:12px;color:var(--ink-3);margin-top:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:14px}
.eyebrow{font-family:var(--display);font-size:12px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);margin:0 0 10px}
h1,h2{font-family:var(--display);font-weight:800;letter-spacing:-.015em;margin:0 0 4px;text-wrap:balance}
h1{font-size:22px} h2{font-size:18px}
.sub{font-size:14px;color:var(--ink-2);margin:0}
.note{font-size:12px;color:var(--ink-3);margin:10px 0 0}
.lab{display:block;font-size:14px;color:var(--ink-2);margin-top:12px}
.lab input{display:block;width:100%;margin-top:5px;padding:12px;border:1.5px solid var(--line);
  border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
.lab input:focus{outline:none;border-color:var(--accent)}
.btn{display:block;width:100%;margin-top:14px;padding:13px;border:0;border-radius:10px;
  background:var(--accent);color:var(--on-accent);font-family:var(--display);font-weight:600;
  font-size:16px;cursor:pointer}
.btn:disabled{background:var(--surface-2);color:var(--ink-3);
  box-shadow:inset 0 0 0 1.5px var(--line);opacity:1;cursor:not-allowed}
.btn.ghost{background:none;color:var(--ink-2);border:1.5px solid var(--line)}
.btn.sm{padding:9px;font-size:14px;margin-top:8px}
/* barre de navigation : jour et entreprise */
.bar{display:flex;align-items:center;gap:8px;margin-top:12px}
.bar .day{flex:1;text-align:center;font-family:var(--display);font-weight:600;font-size:14px}
.nav{width:38px;height:38px;flex:none;border:1.5px solid var(--line);border-radius:10px;
  background:var(--surface);color:var(--ink);font-size:18px;cursor:pointer;line-height:1}
.nav:disabled{opacity:.3;cursor:not-allowed}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:6px 13px;font-size:14px;
  background:var(--surface);color:var(--ink-2);cursor:pointer;font-family:var(--body)}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
/* onglets */
.tabs{display:flex;gap:0;margin-top:14px;border-bottom:1px solid var(--line)}
.tab{flex:1;padding:11px 4px;border:0;background:none;color:var(--ink-3);font-family:var(--display);
  font-weight:600;font-size:14px;cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab b{display:block;font-size:18px;line-height:1.2}
/* cuisine */
.platbloc{padding:12px 0;border-bottom:1px solid var(--line)}
.platbloc:last-child{border-bottom:0;padding-bottom:0}
.plat{display:flex;align-items:baseline;gap:12px}
.qui{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 0 58px}
.nomq{font-size:12px;background:var(--surface-2);border-radius:999px;padding:3px 9px;
  color:var(--ink-2);white-space:nowrap}
.nomq.paye{background:var(--good-soft);color:var(--good)}
/* Un règlement que le traiteur a saisi lui-même : l'origine se lit, elle ne
   se devine pas. Discret — c'est une précision, pas une alerte. */
.tag-moi{flex:none;font-size:11px;color:var(--ink-3);background:var(--surface-2);
  border-radius:20px;padding:3px 8px;white-space:nowrap}
/* L'ordre d'arrivée : une ligne par commande, l'heure en tête de ligne.
   Le montant passe à l'accent quand il reste quelque chose à régler. */
.arr-titre{margin-top:22px}
.arr{display:flex;align-items:baseline;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.arr-h{flex:none;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;min-width:40px}
.arr-qui{flex:1;min-width:0}
.arr-qui b{display:block;font-size:15px;font-weight:600}
.arr-qui span{display:block;font-size:12px;color:var(--ink-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arr-m{flex:none;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.arr-m.du{color:var(--accent)}
.qte{font-family:var(--display);font-weight:700;font-size:28px;line-height:1;color:var(--accent);
  min-width:46px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.plat .nm{font-size:16px;overflow-wrap:break-word;min-width:0}
.plat .lim{display:block;font-size:12px;color:var(--warn)}
.sitehead{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.04em;
  text-transform:uppercase;color:var(--ink-3);margin:18px 0 0}
.sitehead:first-child{margin-top:0}
.rub{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  margin:14px 0 2px;font-family:var(--display);font-weight:600}
/* tuiles */
.tiles{display:flex;gap:9px;margin-top:4px}
.tile{flex:1;background:var(--surface-2);border-radius:10px;padding:12px 11px}
.tile i{display:block;font-style:normal;font-size:12px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);font-family:var(--display);font-weight:600}
.tile b{display:block;font-family:var(--display);font-size:22px;margin-top:3px;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile.du b{color:var(--accent)}
.tile.ok b{color:var(--good)}
/* lignes nommées */
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .who{flex:1;min-width:0}
.row .who b{display:block;font-size:16px;font-weight:600;overflow-wrap:break-word}
/* Depuis qu'une ligne peut porter deux boutons, un détail long la faisait
   tripler de hauteur. Deux lignes au maximum, le reste dans l'infobulle. */
.row .who span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;font-size:12px;color:var(--ink-3);overflow-wrap:break-word}
.row .amt{font-family:var(--display);font-weight:700;font-size:16px;flex:none;
  font-variant-numeric:tabular-nums}
.row .amt.du{color:var(--accent)} .row .amt.ok{color:var(--good)}
.act{flex:none;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);
  color:var(--ink-2);font-size:12px;padding:7px 10px;text-decoration:none;cursor:pointer;
  font-family:var(--body);white-space:nowrap}
.tag{display:inline-block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  font-family:var(--display);font-weight:600;padding:2px 7px;border-radius:999px;
  background:var(--surface-3);color:var(--ink-3);margin-left:6px}
.vide{font-size:14px;color:var(--ink-3);padding:16px 0;text-align:center}
.err{background:var(--surface-2);border:1px solid var(--accent);color:var(--ink);
  border-radius:10px;padding:11px 13px;font-size:14px;margin-top:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(14px);
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:14px;
  opacity:0;pointer-events:none;transition:.18s;max-width:90vw;text-align:center;z-index:9}
.toast.on{opacity:1;transform:translateX(-50%)}
.shot{display:block;max-width:100%;border-radius:10px;margin-top:10px;border:1px solid var(--line)}
  .pt{flex:none;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line-strong);
    background:var(--surface);cursor:pointer;padding:0;display:flex;align-items:center;
    justify-content:center;color:transparent;font-size:16px;line-height:1}
  .pt.on{border-color:var(--good);background:var(--good-soft);color:var(--good)}
  .pt:disabled{opacity:.4;cursor:wait}
  .row.fait .who b{color:var(--ink-3)}
  .avance{font-size:14px;color:var(--ink-2);margin:0 0 4px}
  .avance b{font-family:var(--display);color:var(--good)}
  .avance.reste b{color:var(--accent)}
  .voile{position:fixed;inset:0;background:rgba(20,15,12,.45);display:none;z-index:20}
  .voile.on{display:block}
  .panneau{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;z-index:21;
    background:var(--surface);border-radius:16px 16px 0 0;padding:20px 16px
    calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:.22s;
    max-width:560px;margin:0 auto}
  .panneau.on{transform:translateY(0)}
  .poignee{width:38px;height:4px;border-radius:99px;background:var(--line-strong);margin:0 auto 14px}
  .lab{display:block;font-size:14px;color:var(--ink-2);margin-top:12px}
  .lab input,.lab select{display:block;width:100%;margin-top:5px;padding:11px;
    border:1.5px solid var(--line);border-radius:10px;background:var(--surface);
    color:var(--ink);font:inherit}
  .lab input:focus,.lab select:focus{outline:none;border-color:var(--accent)}
  .plats{display:flex;flex-direction:column;gap:7px;margin-top:10px}
  .plat2{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);
    border-radius:10px;padding:10px 11px;cursor:pointer;background:var(--surface)}
  .plat2.on{border-color:var(--accent);background:var(--accent-soft)}
  .plat2 .n{flex:1;min-width:0;font-size:14px;text-align:left;overflow-wrap:break-word}
  .plat2 .p{font-family:var(--display);font-weight:600;font-size:14px;flex:none}
  .plat2:disabled{opacity:.45;cursor:not-allowed}
  .rubt{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
    margin:14px 0 0;font-family:var(--display);font-weight:600}
  .tab{font-size:12px}
  .tab b{font-size:16px}
  .cherche{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:10px;
    background:var(--surface);color:var(--ink);font:inherit;margin-top:10px}
  .cherche:focus{outline:none;border-color:var(--accent)}
  .dette{font-family:var(--display);font-weight:700;font-size:16px;flex:none;color:var(--accent);
    font-variant-numeric:tabular-nums}
  .dette.rien{color:var(--ink-3);font-weight:500;font-size:14px}
  .pastille{display:inline-block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
    font-family:var(--display);font-weight:600;padding:2px 6px;border-radius:999px;
    background:var(--warn-soft);color:var(--warn);margin-left:6px}
  /* `hidden` doit l'emporter : une règle de classe qui pose display (flex, block)
     bat l'attribut, et l'élément reste affiché alors qu'on le croit caché.
     C'est ce qui laissait un bandeau rose vide en haut du menu chaque matin,
     et le bouton « Changer ma commande » sur une commande déjà réglée. */
  [hidden]{display:none !important}

/* ------------------------------------------------------------------
   Garde-fou iOS — doit rester le DERNIER bloc de cette feuille.
   Safari iOS zoome la page des qu'on touche un champ dont la police
   calculee est sous 16 px. Les champs heritent de .lab, qui est a
   14 px : un selecteur « input » nu perd la bataille de specificite.
   D'ou les deux selecteurs, et la position en fin de feuille.
   Verifie en mesurant getComputedStyle(champ).fontSize, jamais la
   declaration : c'est le rendu qui zoome, pas le code.
   ------------------------------------------------------------------ */
input,select,textarea{font-size:16px}
.lab input,.lab select,.lab textarea{font-size:16px}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand"><svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2733 845" role="img" aria-label="Lekk bi"><g transform="translate(40,793) scale(1,-1)"><path fill="var(--logo-ink,#241C18)" d="M189 -5Q152 -5 121.0 10.0Q90 25 71.0 56.5Q52 88 52 141V681H197V193Q197 156 210.5 145.5Q224 135 245 135V0Q235 -2 218.5 -3.5Q202 -5 189 -5ZM538 -9Q465 -9 409.5 22.0Q354 53 323.5 110.0Q293 167 293 244Q293 320 323.5 378.0Q354 436 409.5 468.5Q465 501 538 501Q613 501 668.0 467.0Q723 433 753.0 375.5Q783 318 783 246Q783 233 782.0 221.0Q781 209 780 202H407V306H668L651 263Q651 318 623.5 353.0Q596 388 539 388Q488 388 457.5 357.0Q427 326 427 275V220Q427 165 458.5 134.5Q490 104 546 104Q593 104 620.5 123.0Q648 142 667 170L766 115Q734 56 676.0 23.5Q618 -9 538 -9ZM957 246V265L1157 489H1321L1099 238L1095 286L1326 0H1156ZM856 681H1001V0H856ZM1469 246V265L1669 489H1833L1611 238L1607 286L1838 0H1668ZM1368 681H1513V0H1368Z"/><path fill="var(--logo-accent,#A3123C)" d="M2151 -12Q2087 -12 2039.0 19.5Q1991 51 1964.5 108.5Q1938 166 1938 245Q1938 328 1964.0 385.0Q1990 442 2037.5 471.5Q2085 501 2150 501Q2216 501 2267.0 468.5Q2318 436 2347.0 378.0Q2376 320 2376 245Q2376 170 2347.5 111.5Q2319 53 2268.5 20.5Q2218 -12 2151 -12ZM1880 0V681H2026V353H2017V125H2026L1989 0ZM2123 125Q2168 125 2197.5 158.5Q2227 192 2227 245Q2227 297 2197.5 330.5Q2168 364 2123 364Q2079 364 2049.0 330.5Q2019 297 2019 245Q2019 192 2049.0 158.5Q2079 125 2123 125ZM2599 0H2453V489H2599Z"/><circle fill="var(--logo-accent,#A3123C)" cx="2526.0" cy="652.8" r="99.8"/></g></svg><span>·</span>ma journée</div>
    <div class="when" id="when">Chargement…</div>
  </div>

  <div id="err-box"></div>

  <!-- connexion -->
  <div class="card" id="s-login" hidden>
    <p class="eyebrow">Accès traiteur</p>
    <h1>Se connecter</h1>
    <p class="sub">Cet écran montre les noms et l'argent. Il demande un compte.</p>
    <label class="lab" for="mail">Adresse e-mail<input type="email" id="mail" autocomplete="username" inputmode="email"></label>
    <label class="lab" for="mdp">Mot de passe<input type="password" id="mdp" autocomplete="current-password"></label>
    <button class="btn" id="go-login">Entrer</button>
  </div>

  <!-- tableau -->
  <div id="s-tab" hidden>
    <div class="bar">
      <button class="nav" id="go-hier" aria-label="Jour précédent">‹</button>
      <div class="day" id="jour">—</div>
      <button class="nav" id="go-demain" aria-label="Jour suivant">›</button>
    </div>
    <div class="chips" id="chips"></div>

    <div class="tabs">
      <button class="tab on" data-v="cuisine">À préparer<b id="n-cuisine">—</b></button>
      <button class="tab" data-v="argent">Encaissé<b id="n-argent">—</b></button>
      <button class="tab" data-v="monde">Impayés<b id="n-monde">—</b></button>
      <button class="tab" data-v="clients">Clients<b id="n-clients">—</b></button>

    <button class="btn ghost sm" id="go-saisir">Ajouter une commande</button>

</div>
<div class="voile" id="voile"></div>
<div class="panneau" id="panneau"><div class="poignee"></div><div id="panneau-corps"></div></div>

<script>
/* ===================================================================
   CONFIGURATION — les deux mêmes lignes que la page employé
   =================================================================== */
var CONFIG = {
  url: "https://fiqrfrcsgxqvqjgvzasr.supabase.co",
  cle: "sb_publishable_yAowOWU05DlJ_xQXU0vQ0A_bk6O23ht"
};
/* =================================================================== */

(function(){
  "use strict";
  var $ = function(i){ return document.getElementById(i); };
  var fcfa = function(n){ return (n||0).toLocaleString("fr-FR").replace(/ | /g," ") + " F"; };
  var pre  = function(n){ return String(n||"").split(" ")[0]; };

  /* ---------- session ---------- */
  // La clé publique ci-dessus ne donne accès à rien de cet écran : le serveur
  // exige un compte connecté ET rattaché à un traiteur. Le jeton de session est
  // gardé sur l'appareil pour ne pas redemander le mot de passe chaque matin.
  var JETON = null, RAFRAICHIR = null;
  function lire(){
    try {
      JETON = localStorage.getItem("dema_jeton");
      RAFRAICHIR = localStorage.getItem("dema_rafraichir");
    } catch(e){}
  }
  function garder(d){
    JETON = d.access_token; RAFRAICHIR = d.refresh_token;
    try {
      localStorage.setItem("dema_jeton", JETON);
      localStorage.setItem("dema_rafraichir", RAFRAICHIR || "");
    } catch(e){}
  }
  function oublier(){
    JETON = null; RAFRAICHIR = null;
    try { localStorage.removeItem("dema_jeton"); localStorage.removeItem("dema_rafraichir"); } catch(e){}
  }

  var tT = null;
  function toast(t){
    var el = $("toast"); el.textContent = t; el.classList.add("on");
    clearTimeout(tT); tT = setTimeout(function(){ el.classList.remove("on"); }, 2600);
  }
  function erreur(m){
    var b = $("err-box"); b.innerHTML = "";
    if(!m) return;
    var d = document.createElement("div"); d.className = "err"; d.textContent = m; b.appendChild(d);
  }
  function ecran(n){
    ["login","tab"].forEach(function(k){ $("s-"+k).hidden = (k !== n); });
    window.scrollTo(0,0);
  }

  function connexion(mail, mdp){
    return fetch(CONFIG.url + "/auth/v1/token?grant_type=password", {
      method:"POST",
      headers:{ "apikey": CONFIG.cle, "Content-Type":"application/json" },
      body: JSON.stringify({ email: mail, password: mdp })
    }).then(function(r){
      return r.json().then(function(d){
        if(!r.ok) throw new Error(d.error_description || d.msg || d.message || "Connexion refusée");
        if(!d.access_token) throw new Error("Réponse inattendue du serveur");
        garder(d); return d;
      });
    });
  }
  function rafraichir(){
    if(!RAFRAICHIR) return Promise.reject(new Error("session expirée"));
    return fetch(CONFIG.url + "/auth/v1/token?grant_type=refresh_token", {
      method:"POST",
      headers:{ "apikey": CONFIG.cle, "Content-Type":"application/json" },
      body: JSON.stringify({ refresh_token: RAFRAICHIR })
    }).then(function(r){
      return r.json().then(function(d){
        if(!r.ok || !d.access_token) throw new Error("session expirée");
        garder(d); return d;
      });
    });
  }

  // Un appel protégé. Si le jeton a expiré pendant la nuit, on le renouvelle une
  // fois en silence plutôt que de la renvoyer au mot de passe.
  function rpc(fn, args, reessai){
    return fetch(CONFIG.url + "/rest/v1/rpc/" + fn, {
      method:"POST",
      headers:{ "apikey": CONFIG.cle, "Authorization":"Bearer " + JETON,
                "Content-Type":"application/json" },
      body: JSON.stringify(args || {})
    }).then(function(r){
      if((r.status === 401 || r.status === 403) && !reessai && RAFRAICHIR)
        return rafraichir().then(function(){ return rpc(fn, args, true); });
      return r.text().then(function(txt){
        var d = null;
        try { d = txt ? JSON.parse(txt) : null; } catch(e){ d = txt; }
        if(!r.ok){
          var m = String((d && (d.message || d.hint || d.details)) || ("Erreur " + r.status))
                    .replace(/^(ERREUR|ERROR):\s*/i, "");
          throw new Error(m);
        }
        return d;
      });
    });
  }

  /* ---------- état ---------- */
  var DATA = null, JOUR = null, SITE = null, VUE = "cuisine", FILTRE = "tous";

  function dateFr(iso){
    return new Date(iso + "T12:00:00").toLocaleDateString("fr-FR",
      { weekday:"long", day:"numeric", month:"long" });
  }
  function aujourdhui(){
    // l'heure de Dakar, pas celle du téléphone s'il voyage
    var d = new Date(new Date().toLocaleString("en-US", { timeZone:"Africa/Dakar" }));
    return d.toISOString().slice(0,10);
  }
  function decale(iso, n){
    var d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n);
    return d.toISOString().slice(0,10);
  }

  function charger(){
    erreur(null);
    $("when").textContent = "Chargement…";
    return rpc("fn_tableau", { p_jour: JOUR, p_site: SITE }).then(function(d){
      DATA = d; JOUR = d.jour;
      rendre();
      ecran("tab");
    }).catch(function(e){
      if(/session expirée/i.test(e.message)){ oublier(); demarrer(); return; }
      $("when").textContent = "—";
      erreur(e.message);
      if(!DATA) ecran("login");
    });
  }

  /* ---------- rendu ---------- */
  function rendre(){
    var d = DATA;
    $("when").textContent = d.traiteur;
    $("jour").textContent = dateFr(d.jour) + (d.jour === aujourdhui() ? " · aujourd'hui" : "");
    $("go-demain").disabled = d.jour >= aujourdhui();

    // entreprises
    var ch = $("chips"); ch.innerHTML = "";
    var faire = function(lib, slug){
      var b = document.createElement("button");
      b.className = "chip" + (SITE === slug ? " on" : "");
      b.textContent = lib;
      b.addEventListener("click", function(){ SITE = slug; CLIENTS = null; charger(); });
      ch.appendChild(b);
    };
    SITE = d.filtre || null;
    if((d.sites||[]).length > 1) faire("Toutes", null);
    (d.sites||[]).forEach(function(s){ faire(s.nom + " · " + s.commandes, s.slug); });

    // le total vient du serveur : il ne porte que sur ce qui est affiché
    var tot = d.total || { commandes:0, du:0, encaisse:0, reste:0 };
    var plats = 0;
    (d.cuisine||[]).forEach(function(c){ (c.rubriques||[]).forEach(function(r){
      (r.articles||[]).forEach(function(a){ plats += a.quantite; }); }); });

    $("n-cuisine").textContent = plats;
    $("n-argent").textContent = fcfa(tot.encaisse);
    $("n-monde").textContent = (d.manquants||[]).length;

    cuisine(d); argent(d, tot); monde(d);
    // le compteur de l'onglet ne doit pas rester vide tant qu'on ne l'a pas
    // ouvert : on charge la liste une fois, en arrière-plan
    if(VUE === "clients" || CLIENTS) rendreClients();
    else chargerClients();
    ["cuisine","argent","monde","clients"].forEach(function(v){
      $("v-"+v).hidden = (v !== VUE);
      var t = document.querySelector('.tab[data-v="'+v+'"]');
      if(t) t.classList.toggle("on", v === VUE);
    });
  }

  function cuisine(d){
    var box = $("v-cuisine"); box.innerHTML = "";
    if(!(d.cuisine||[]).length){
      box.innerHTML = '<p class="vide">Aucune commande pour ce jour.</p>'; return;
    }
    d.cuisine.forEach(function(c){
      if(d.cuisine.length > 1 || (d.sites||[]).length > 1){
        var h = document.createElement("p"); h.className = "sitehead"; h.textContent = c.site;
        box.appendChild(h);
      }
      (c.rubriques||[]).forEach(function(r){
        var t = document.createElement("p"); t.className = "rub"; t.textContent = r.nom;
        box.appendChild(t);
        (r.articles||[]).forEach(function(a){
          var bloc = document.createElement("div"); bloc.className = "platbloc";
          var li = document.createElement("div"); li.className = "plat";
          var q = document.createElement("div"); q.className = "qte"; q.textContent = a.quantite;
          var n = document.createElement("div"); n.className = "nm"; n.textContent = a.nom;
          if(a.limite){
            var l = document.createElement("span"); l.className = "lim";
            l.textContent = a.quantite >= a.limite
              ? "limite atteinte (" + a.limite + ")"
              : "limite " + a.limite + " · reste " + (a.limite - a.quantite);
            n.appendChild(l);
          }
          li.appendChild(q); li.appendChild(n); bloc.appendChild(li);

          // La feuille de distribution : à qui donner ce plat à midi. Le sondage
          // WhatsApp affichait déjà les noms sous chaque option ; sans eux, elle
          // a des quantités mais ne sait pas qui sert quoi.
          if((a.qui || []).length){
            // Deux « Moussa » sur le même plat ne se distinguent pas : on ajoute
            // l'initiale du nom de famille, et seulement là où c'est nécessaire.
            var compte = {};
            a.qui.forEach(function(p2){
              var f = pre(p2.nom); compte[f] = (compte[f] || 0) + 1;
            });
            var g = document.createElement("div"); g.className = "qui";
            a.qui.forEach(function(p2){
              var f = pre(p2.nom), reste = String(p2.nom).split(" ").slice(1).join(" ");
              var lib = (compte[f] > 1 && reste) ? f + " " + reste.charAt(0).toUpperCase() + "." : f;
              var sp = document.createElement("span");
              sp.className = "nomq" + (p2.paye ? " paye" : "");
              sp.textContent = lib + (p2.qte > 1 ? " ×" + p2.qte : "");
              sp.title = p2.nom + (p2.paye ? " · réglé" : " · pas encore réglé");
              g.appendChild(sp);
            });
            bloc.appendChild(g);
          }
          box.appendChild(bloc);
        });
      });
    });
    arrivees(d, box);
  }

  // À quelle heure chacun a commandé. Si le serveur n'a pas encore la mise à
  // jour de fn_tableau, la liste est absente et le bloc ne s'affiche pas :
  // les deux versions cohabitent, l'ordre de déploiement n'a pas d'importance.
  function arrivees(d, box){
    var liste = d.arrivees || [];
    if(!liste.length) return;
    var t = document.createElement("p"); t.className = "rub arr-titre";
    t.textContent = "Dans l'ordre d'arrivée";
    box.appendChild(t);
    var plusieurs = (d.sites || []).length > 1;
    liste.forEach(function(c){
      var r = document.createElement("div"); r.className = "arr";
      var h = document.createElement("span"); h.className = "arr-h"; h.textContent = c.heure;
      var w = document.createElement("div"); w.className = "arr-qui";
      w.innerHTML = "<b></b><span></span>";
      w.children[0].textContent = c.nom + (c.par ? " · saisie par " + pre(c.par) : "");
      w.children[1].textContent = (plusieurs ? c.site + " · " : "") + (c.detail || "—");
      var a = document.createElement("span");
      a.className = "arr-m" + ((c.reste || 0) > 0 ? " du" : "");
      a.textContent = fcfa(c.montant);
      r.appendChild(h); r.appendChild(w); r.appendChild(a);
      box.appendChild(r);
    });
  }

  function argent(d, tot){
    var box = $("v-argent"); box.innerHTML = "";
    var c1 = document.createElement("div"); c1.className = "card";
    c1.innerHTML = '<p class="eyebrow">La journée</p><div class="tiles">'
      + '<div class="tile"><i>Commandé</i><b></b></div>'
      + '<div class="tile ok"><i>Encaissé</i><b></b></div>'
      + '<div class="tile du"><i>Reste</i><b></b></div></div>';
    var bs = c1.querySelectorAll(".tile b");
    bs[0].textContent = fcfa(tot.du); bs[1].textContent = fcfa(tot.encaisse);
    bs[2].textContent = fcfa(tot.reste);
    box.appendChild(c1);

    var c2 = document.createElement("div"); c2.className = "card";
    var e = document.createElement("p"); e.className = "eyebrow";
    e.textContent = "Par moyen de paiement"; c2.appendChild(e);
    if(!(d.canaux||[]).length){
      c2.innerHTML += '<p class="vide">Rien d\'encaissé pour l\'instant.</p>';
    } else {
      d.canaux.forEach(function(k){
        var r = document.createElement("div"); r.className = "row";
        var w = document.createElement("div"); w.className = "who";
        w.innerHTML = "<b></b><span></span>";
        w.children[0].textContent = k.canal;
        w.children[1].textContent = k.nb + (k.nb > 1 ? " règlements" : " règlement");
        var a = document.createElement("div"); a.className = "amt ok"; a.textContent = fcfa(k.encaisse);
        r.appendChild(w); r.appendChild(a); c2.appendChild(r);
      });
      var n = document.createElement("p"); n.className = "note";
      n.textContent = "À rapprocher de tes relevés Wave, Orange Money et Mix.";
      c2.appendChild(n);
    }
    box.appendChild(c2);

    // Les règlements déclarés. C'est ici qu'elle rapproche : elle ouvre Wave,
    // descend sa liste, coche. Ce qui reste décoché à la fin est exactement ce
    // qu'elle doit éclaircir.
    var tous = d.paiements || [];
    var faits = tous.filter(function(p){ return p.pointe; }).length;
    var avecCapture = tous.filter(function(p){ return !!p.preuve; }).length;

    var c3 = document.createElement("div"); c3.className = "card";
    var e3 = document.createElement("p"); e3.className = "eyebrow";
    e3.textContent = "Règlements déclarés (" + tous.length + ")";
    c3.appendChild(e3);

    if(!tous.length){
      c3.innerHTML += '<p class="vide">Aucun règlement déclaré.</p>';
      box.appendChild(c3);
      return;
    }

    var av = document.createElement("p");
    av.className = "avance" + (faits < tous.length ? " reste" : "");
    av.innerHTML = "<b></b><span></span>";
    av.children[0].textContent = faits + " sur " + tous.length;
    av.children[1].textContent = " pointés · " + avecCapture
      + (avecCapture > 1 ? " avec capture" : " avec capture");
    c3.appendChild(av);

    var FILTRES = [["tous","Tous"], ["apointer","À pointer"],
                   ["capture","Avec capture"], ["sans","Sans capture"]];
    var ch = document.createElement("div"); ch.className = "chips";
    FILTRES.forEach(function(f){
      var b = document.createElement("button");
      b.className = "chip" + (FILTRE === f[0] ? " on" : "");
      b.textContent = f[1];
      b.addEventListener("click", function(){ FILTRE = f[0]; rendre(); });
      ch.appendChild(b);
    });
    c3.appendChild(ch);

    var liste = tous.filter(function(p){
      if(FILTRE === "apointer") return !p.pointe;
      if(FILTRE === "capture")  return !!p.preuve;
      if(FILTRE === "sans")     return !p.preuve;
      return true;
    });
    if(!liste.length){
      var v = document.createElement("p"); v.className = "vide";
      v.textContent = FILTRE === "apointer" ? "Tout est pointé." : "Rien dans ce filtre.";
      c3.appendChild(v);
    }

    liste.forEach(function(p){
      var r = document.createElement("div"); r.className = "row" + (p.pointe ? " fait" : "");

      var pt = document.createElement("button");
      pt.className = "pt" + (p.pointe ? " on" : "");
      pt.type = "button"; pt.textContent = "✓";
      pt.setAttribute("aria-label", p.pointe ? "Dépointer " + p.qui : "Pointer " + p.qui);
      pt.addEventListener("click", function(){
        // on coche tout de suite, on défait si le serveur refuse : au marché,
        // le réseau rame et attendre une seconde par ligne est insupportable
        var avant = p.pointe;
        p.pointe = !avant;
        pt.classList.toggle("on", p.pointe);
        r.classList.toggle("fait", p.pointe);
        pt.disabled = true;
        rpc("fn_pointer", { p_paiement: p.id, p_pointe: p.pointe })
          .then(function(){ rendre(); })
          .catch(function(e){
            p.pointe = avant;
            pt.classList.toggle("on", avant); r.classList.toggle("fait", avant);
            pt.disabled = false; toast(e.message);
          });
      });
      r.appendChild(pt);

      var w = document.createElement("div"); w.className = "who";
      w.innerHTML = "<b></b><span></span>";
      w.children[0].textContent = p.qui;
      var det = p.moyen + " · " + p.heure;
      if((d.sites||[]).length > 1) det = p.site + " · " + det;
      if((p.pour||[]).length) det += " · pour " + p.pour.map(pre).join(", ");
      if(!p.preuve) det += " · sans capture";
      w.children[1].textContent = det;
      var a = document.createElement("div"); a.className = "amt ok"; a.textContent = fcfa(p.montant);
      r.appendChild(w); r.appendChild(a);
      if(p.par_traiteur){
        var tg = document.createElement("span"); tg.className = "tag-moi";
        tg.textContent = "saisi par toi"; r.appendChild(tg);
      }
      if(p.preuve){
        var b = document.createElement("button"); b.className = "act"; b.textContent = "Capture";
        b.addEventListener("click", function(){ voirCapture(p.preuve, r, b); });
        r.appendChild(b);
      }
      c3.appendChild(r);
    });
    box.appendChild(c3);
  }

  function monde(d){

        var r = document.createElement("div"); r.className = "row";

      e2.textContent = "Noms qui se ressemblent"; c2.appendChild(e2);
      var s = document.createElement("p"); s.className = "sub";
      s.textContent = "Peut-être la même personne inscrite deux fois. Rien n'est fusionné sans toi.";
      c2.appendChild(s);
      d.doublons.forEach(function(x){
        var r = document.createElement("div"); r.className = "row";
        var w = document.createElement("div"); w.className = "who";
        w.innerHTML = "<b></b><span></span>";
        w.children[0].textContent = x.a + "  /  " + x.b;
        w.children[1].textContent = x.site;
        r.appendChild(w); c2.appendChild(r);
      });
      box.appendChild(c2);

  // La capture n'est pas publique : on demande au serveur un lien signé, valable
  // cinq minutes, et on l'affiche sous la ligne.
  function voirCapture(chemin, ligne, bouton){
    var deja = ligne.parentNode.querySelector('img[data-src="'+chemin+'"]');
    if(deja){ deja.remove(); bouton.textContent = "Capture"; return; }
    bouton.textContent = "…";
    fetch(CONFIG.url + "/storage/v1/object/sign/preuves/" + chemin, {
      method:"POST",
      headers:{ "apikey": CONFIG.cle, "Authorization":"Bearer " + JETON,
                "Content-Type":"application/json" },
      body: JSON.stringify({ expiresIn: 300 })
    }).then(function(r){ return r.json(); }).then(function(d){
      if(!d.signedURL && !d.signedUrl) throw new Error("introuvable");
      var img = document.createElement("img"); img.className = "shot";
      img.setAttribute("data-src", chemin);
      img.src = CONFIG.url + "/storage/v1" + (d.signedURL || d.signedUrl);
      img.alt = "Capture du paiement";
      ligne.parentNode.insertBefore(img, ligne.nextSibling);
      bouton.textContent = "Masquer";
    }).catch(function(){
      bouton.textContent = "Capture"; toast("Capture introuvable");
    });
  }

  /* ---------- les clients ---------- */
  var CLIENTS = null, RECHERCHE = "";
  function chargerClients(){
    return rpc("fn_clients", { p_site: SITE, p_q: RECHERCHE || null })
      .then(function(d){ CLIENTS = d; rendreClients(); })
      .catch(function(e){ toast(e.message); });
  }

  function rendreClients(){
    var box = $("v-clients"); box.innerHTML = "";
    if(!CLIENTS){
      box.innerHTML = '<div class="card"><p class="vide">Chargement…</p></div>';
      chargerClients(); return;

    var gens = CLIENTS.clients || [];

    var c = document.createElement("div"); c.className = "card";

    e.textContent = "Les gens (" + gens.length + ")";
    c.appendChild(e);
    var sb = document.createElement("p"); sb.className = "sub";
    sb.textContent = doivent.length
      ? doivent.length + (doivent.length > 1 ? " personnes doivent " : " personne doit ")

      : "Personne ne doit rien. Tout est à jour.";
    c.appendChild(sb);

    var inp = document.createElement("input"); inp.className = "cherche"; inp.type = "search";

    var tempo = null;
    inp.addEventListener("input", function(){
      RECHERCHE = inp.value;
      clearTimeout(tempo);
      tempo = setTimeout(function(){ chargerClients(); }, 300);

    if(!gens.length){
      var v = document.createElement("p"); v.className = "vide";
      v.textContent = RECHERCHE ? "Personne ne correspond." : "Personne encore inscrite.";
      c.appendChild(v);
    }

    gens.forEach(function(x){

      var w = document.createElement("div"); w.className = "who";

      w.children[0].textContent = x.nom;

        tg.textContent = "pas inscrit"; w.children[0].appendChild(tg);

      var det = [];
      if((CLIENTS.clients||[]).length && SITE === null) det.push(x.site);
      if(x.tel) det.push(x.tel);
      det.push(x.repas + (x.repas > 1 ? " repas" : " repas") + " sur 30 j");
      if(x.dernier) det.push("dernier " + new Date(x.dernier + "T12:00:00")
        .toLocaleDateString("fr-FR", { day:"numeric", month:"short" }));
      w.children[1].textContent = det.join(" · ");
      var d = document.createElement("div");
      d.className = "dette" + (x.du > 0 ? "" : " rien");
      d.textContent = x.du > 0 ? fcfa(x.du) : "à jour";
      r.appendChild(w); r.appendChild(d);

      if(x.du > 0 && x.tel){
        var num = String(x.tel).replace(/\D/g,"");
        if(num.length === 9) num = "221" + num;
        var lien = document.createElement("a"); lien.className = "act";
        lien.href = "https://wa.me/" + num + "?text=" + encodeURIComponent(
          "Bonjour " + pre(x.nom) + ", il reste " + fcfa(x.du) + " à régler sur tes repas.");
        lien.target = "_blank"; lien.rel = "noopener"; lien.textContent = "Relancer";
        r.appendChild(lien);
      }
      var mo = document.createElement("button"); mo.className = "act"; mo.textContent = "Fiche";
      mo.addEventListener("click", function(){ ficheClient(x); });
      r.appendChild(mo);
      c.appendChild(r);
    });
    box.appendChild(c);

    if((CLIENTS.doublons||[]).length){
      var c2 = document.createElement("div"); c2.className = "card";
      var e2 = document.createElement("p"); e2.className = "eyebrow";
      e2.textContent = "Peut-être la même personne"; c2.appendChild(e2);
      var s2 = document.createElement("p"); s2.className = "sub";
      s2.textContent = "Deux fiches aux noms proches. Rien n'est réuni sans toi.";
      c2.appendChild(s2);
      CLIENTS.doublons.forEach(function(x){
        var r = document.createElement("div"); r.className = "row";
        var w = document.createElement("div"); w.className = "who";
        w.innerHTML = "<b></b><span></span>";
        w.children[0].textContent = x.a + "  /  " + x.b;
        w.children[1].textContent = x.site;
        var bt = document.createElement("button"); bt.className = "act";
        bt.textContent = "Réunir";
        bt.addEventListener("click", function(){ ficheFusion(x); });
        r.appendChild(w); r.appendChild(bt); c2.appendChild(r);
      });
      box.appendChild(c2);
    }
  }

  // Quelqu'un paie en espèces à midi, ou envoie par Wave sans jamais rouvrir
  // le lien. Sans ce panneau, sa ligne reste « pas encore réglé » pour
  // toujours, et « Relancer » finit par écrire à quelqu'un qui a payé.
  function ficheEncaisser(m){
    var f = document.createElement("div");
    var h = document.createElement("h2"); h.textContent = "Encaisser";
    var sb = document.createElement("p"); sb.className = "sub";
    sb.textContent = "Pour un règlement que tu as reçu toi-même. Il est noté comme "
                   + "pointé : c'est toi qui as vu l'argent arriver.";
    f.appendChild(h); f.appendChild(sb);

    var qui = document.createElement("div"); qui.className = "row";
    var w = document.createElement("div"); w.className = "who";
    w.innerHTML = "<b></b><span></span>";
    w.children[0].textContent = m.nom;
    w.children[1].textContent = (m.detail || "—") + " · reste " + fcfa(m.reste);
    qui.appendChild(w); f.appendChild(qui);

    var l1 = document.createElement("label"); l1.className = "lab"; l1.textContent = "Montant reçu";
    var inp = document.createElement("input"); inp.id = "en-montant"; inp.type = "number";
    inp.min = "1"; inp.max = String(m.reste); inp.step = "1"; inp.value = String(m.reste);
    inp.inputMode = "numeric";
    l1.appendChild(inp); f.appendChild(l1);
    var nt = document.createElement("p"); nt.className = "note";
    nt.textContent = "Laisse le montant tel quel pour solder. Mets moins pour un acompte.";
    f.appendChild(nt);

    var l2 = document.createElement("label"); l2.className = "lab"; l2.textContent = "Comment";
    var sel = document.createElement("select"); sel.id = "en-moyen";
    ((CONF && CONF.moyens) || []).filter(function(x){ return x.actif; })
      .forEach(function(x){
        var o = document.createElement("option"); o.value = x.code; o.textContent = x.nom;
        sel.appendChild(o);
      });
    l2.appendChild(sel); f.appendChild(l2);

    var ok = document.createElement("button"); ok.className = "btn"; ok.textContent = "Enregistrer";
    ok.addEventListener("click", function(){
      var montant = parseInt($("en-montant").value, 10);
      if(!(montant > 0)){ toast("Écris un montant"); return; }
      if(montant > m.reste){ toast("Plus que ce qui reste dû"); return; }
      ok.disabled = true; ok.textContent = "…";
      rpc("fn_encaisser", { p_commandes: [m.id], p_moyen: $("en-moyen").value,
                            p_montant: montant })
        .then(function(res){
          fermerP();
          toast(pre(m.nom) + " · " + fcfa(res.montant)
                + (res.reste > 0 ? " — reste " + fcfa(res.reste) : " — soldé"));
          return charger();
        })
        .catch(function(e){ toast(e.message); ok.disabled = false; ok.textContent = "Enregistrer"; });
    });
    f.appendChild(ok);
    var an = document.createElement("button"); an.className = "btn ghost sm";
    an.textContent = "Annuler"; an.addEventListener("click", fermerP);
    f.appendChild(an);

    // le panneau a besoin de la liste des moyens : elle vient de fn_config
    if(CONF) ouvrirP(f);
    else rpc("fn_config").then(function(c){
      CONF = c;
      ((CONF.moyens)||[]).filter(function(x){ return x.actif; }).forEach(function(x){
        var o = document.createElement("option"); o.value = x.code; o.textContent = x.nom;
        sel.appendChild(o);
      });
      ouvrirP(f);
    }).catch(function(e){ toast(e.message); });
  }

  function ficheClient(x){
    var f = document.createElement("div");
    var h = document.createElement("h2"); h.textContent = "Corriger la fiche";
    var sb = document.createElement("p"); sb.className = "sub";
    sb.textContent = x.du > 0 ? "Doit " + fcfa(x.du) + " en tout." : "À jour.";
    f.appendChild(h); f.appendChild(sb);
    var l1 = document.createElement("label"); l1.className = "lab"; l1.textContent = "Nom";
    var i1 = document.createElement("input"); i1.id = "cl-nom"; i1.value = x.nom;
    l1.appendChild(i1); f.appendChild(l1);
    var l2 = document.createElement("label"); l2.className = "lab"; l2.textContent = "Numéro";
    var i2 = document.createElement("input"); i2.id = "cl-tel"; i2.type = "tel";
    i2.value = x.tel || ""; i2.placeholder = "77 000 00 00";
    l2.appendChild(i2); f.appendChild(l2);
    var ok = document.createElement("button"); ok.className = "btn"; ok.textContent = "Enregistrer";
    ok.addEventListener("click", function(){
      ok.disabled = true; ok.textContent = "…";
      rpc("fn_client_maj", { p_personne: x.id, p_nom: $("cl-nom").value, p_tel: $("cl-tel").value })
        .then(function(){ fermerP(); toast("Fiche corrigée"); return chargerClients(); })
        .catch(function(e){ toast(e.message); ok.disabled = false; ok.textContent = "Enregistrer"; });
    });
    f.appendChild(ok);
    var an = document.createElement("button"); an.className = "btn ghost sm";
    an.textContent = "Annuler"; an.addEventListener("click", fermerP);
    f.appendChild(an);
    ouvrirP(f);
  }

  function ficheFusion(x){
    var f = document.createElement("div");
    var h = document.createElement("h2"); h.textContent = "Réunir deux fiches";
    var sb = document.createElement("p"); sb.className = "sub";
    sb.textContent = "Les commandes et les paiements des deux iront sur celle que tu gardes. "
                   + "C'est définitif.";
    f.appendChild(h); f.appendChild(sb);
    [[x.a_id, x.a, x.b_id], [x.b_id, x.b, x.a_id]].forEach(function(o){
      var bt = document.createElement("button"); bt.className = "btn ghost sm";
      bt.style.marginTop = "10px";
      bt.textContent = "Garder « " + o[1] + " »";
      bt.addEventListener("click", function(){
        bt.disabled = true; bt.textContent = "…";
        rpc("fn_fusionner", { p_garde: o[0], p_absorbe: o[2] })
          .then(function(r){ fermerP(); toast("Réunies sous " + r.nom); return chargerClients(); })
          .then(function(){ return charger(); })
          .catch(function(e){ toast(e.message); bt.disabled = false;
                              bt.textContent = "Garder « " + o[1] + " »"; });
      });
      f.appendChild(bt);
    });
    var an = document.createElement("button"); an.className = "btn ghost sm";
    an.textContent = "Annuler"; an.addEventListener("click", fermerP);
    f.appendChild(an);
    ouvrirP(f);
  }

  /* ---------- saisir une commande pour quelqu'un ---------- */
  var CONF = null;
  function ouvrirP(c){
    $("panneau-corps").innerHTML = ""; $("panneau-corps").appendChild(c);
    $("voile").classList.add("on"); $("panneau").classList.add("on");
  }
  function fermerP(){ $("voile").classList.remove("on"); $("panneau").classList.remove("on"); }
  $("voile").addEventListener("click", fermerP);

  $("go-saisir").addEventListener("click", function(){
    var b = this; b.disabled = true;
    // le menu vient de la configuration : pas besoin d'une lecture de plus
    (CONF ? Promise.resolve(CONF) : rpc("fn_config"))
      .then(function(c){ CONF = c; ficheSaisie(); })
      .catch(function(e){ toast(e.message); })
      .then(function(){ b.disabled = false; });
  });

  function ficheSaisie(){
    var choix = {}, f = document.createElement("div");
    var h = document.createElement("h2"); h.textContent = "Ajouter une commande";
    var sb = document.createElement("p"); sb.className = "sub";
    sb.textContent = "Pour quelqu'un qui t'a appelée. L'heure de clôture ne t'arrête pas.";
    f.appendChild(h); f.appendChild(sb);

    // entreprise
    var l1 = document.createElement("label"); l1.className = "lab"; l1.textContent = "Entreprise";
    var sel = document.createElement("select"); sel.id = "sa-site";
    (DATA.sites||[]).forEach(function(x){
      var o = document.createElement("option"); o.value = x.slug; o.textContent = x.nom;
      if(SITE === x.slug) o.selected = true;
      sel.appendChild(o);
    });
    l1.appendChild(sel); f.appendChild(l1);

    var l2 = document.createElement("label"); l2.className = "lab"; l2.textContent = "Nom de la personne";
    var inp = document.createElement("input"); inp.id = "sa-nom"; inp.type = "text";
    inp.placeholder = "Prénom et nom"; inp.autocomplete = "off";
    l2.appendChild(inp); f.appendChild(l2);

    var jourDOW = new Date(DATA.jour + "T12:00:00").getDay();
    jourDOW = jourDOW === 0 ? 7 : jourDOW;

    var zone = document.createElement("div");
    (CONF.rubriques||[]).forEach(function(r){
      // Le serveur filtre sur le jour de l'ARTICLE (fn_menu : « a.jour is null
      // or a.jour = v_dow »). Filtrer ici sur le drapeau de la RUBRIQUE donnait
      // deux règles pour la même question : une rubrique dont le drapeau et les
      // articles ne disaient plus la même chose apparaissait chez l'employé et
      // disparaissait ici. Une seule règle, celle du serveur.
      var dispo = r.articles.filter(function(a){
        return a.actif && (a.jour === null || a.jour === undefined || a.jour === jourDOW);
      });
      if(!dispo.length) return;
      var t = document.createElement("p"); t.className = "rubt"; t.textContent = r.nom;
      zone.appendChild(t);
      var box = document.createElement("div"); box.className = "plats";
      dispo.forEach(function(a){
        var btn = document.createElement("button"); btn.type = "button"; btn.className = "plat2";
        btn.innerHTML = '<span class="n"></span><span class="p"></span>';
        btn.querySelector(".n").textContent = a.nom;
        btn.querySelector(".p").textContent = r.offert ? "offert" : fcfa(a.prix);
        btn.addEventListener("click", function(){
          if(r.mode === "unique"){
            var etait = choix[r.id] === a.id;
            delete choix[r.id];
            Array.prototype.forEach.call(box.children, function(x){ x.classList.remove("on"); });
            if(!etait){ choix[r.id] = a.id; btn.classList.add("on"); }
          } else {
            choix[r.id] = choix[r.id] || {};
            if(choix[r.id][a.id]){ delete choix[r.id][a.id]; btn.classList.remove("on"); }
            else { choix[r.id][a.id] = 1; btn.classList.add("on"); }
          }
        });
        box.appendChild(btn);
      });
      zone.appendChild(box);
    });
    f.appendChild(zone);

    var ok = document.createElement("button"); ok.className = "btn"; ok.textContent = "Enregistrer";
    ok.addEventListener("click", function(){
      var lignes = [];
      for(var rid in choix){
        if(typeof choix[rid] === "string") lignes.push({ article: choix[rid], qte: 1 });
        else for(var aid in choix[rid]) lignes.push({ article: aid, qte: 1 });
      }
      if(!lignes.length){ toast("Choisis au moins un plat"); return; }
      if(!$("sa-nom").value.trim()){ toast("Écris le nom"); return; }
      ok.disabled = true; ok.textContent = "…";
      rpc("fn_commander_pour", { p_site: $("sa-site").value, p_nom: $("sa-nom").value,
            p_lignes: lignes, p_jour: DATA.jour })
        .then(function(res){
          fermerP(); toast(res.nom + " · " + fcfa(res.montant)); return charger();
        })
        .catch(function(e){ toast(e.message); ok.disabled = false; ok.textContent = "Enregistrer"; });
    });
    f.appendChild(ok);
    var an = document.createElement("button"); an.className = "btn ghost sm";
    an.textContent = "Annuler"; an.addEventListener("click", fermerP);
    f.appendChild(an);
    ouvrirP(f);
  }

  /* ---------- actions ---------- */
  $("go-login").addEventListener("click", function(){
    var m = $("mail").value.trim(), p = $("mdp").value;
    if(!m || !p){ toast("Adresse et mot de passe"); return; }
    erreur(null); this.disabled = true; this.textContent = "Connexion…";
    var self = this;
    connexion(m, p).then(function(){ $("mdp").value = ""; JOUR = null; return charger(); })
      .catch(function(e){ erreur(e.message); })
      .then(function(){ self.disabled = false; self.textContent = "Entrer"; });
  });
  $("go-out").addEventListener("click", function(){
    oublier(); DATA = null; SITE = null; JOUR = null; ecran("login"); $("when").textContent = "—";
  });
  $("go-hier").addEventListener("click", function(){ JOUR = decale(DATA.jour, -1); charger(); });
  $("go-demain").addEventListener("click", function(){ JOUR = decale(DATA.jour, 1); charger(); });
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(t){
    t.addEventListener("click", function(){ VUE = t.getAttribute("data-v"); rendre(); });
  });

  function demarrer(){
    lire();
    if(!JETON){ ecran("login"); $("when").textContent = "—"; return; }
    charger();
  }
  demarrer();
})();
</script>
</body>
</html>
