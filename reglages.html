<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lekk bi — mise en route</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="Mise en route — Lekk bi">
<meta property="og:description" content="Espace traiteur.">
<link rel="preload" href="polices/karla.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="marque/icone-192.png">
<link rel="apple-touch-icon" href="marque/icone-180.png">
<style>
/* Karla, version variable : un seul fichier de 31 Ko pour toutes les graisses
   de 200 a 800, servi depuis ce depot. Remplace les sept fichiers et les deux
   connexions vers Google : la page s'affiche sans dependre d'un tiers, et sans
   rien a laisser passer pour le reseau d'une entreprise.
   Licence SIL OFL 1.1 — voir polices/KARLA-LICENCE.txt */
@font-face{
  font-family:"Karla";
  src:url("polices/karla.woff2") format("woff2-variations"),
      url("polices/karla.woff2") format("woff2");
  font-weight:200 800;
  font-style:normal;
  font-display:swap;
}
:root{
  --paper:#FAF7F2; --surface:#FFFFFF; --surface-2:#F2EDE5; --surface-3:#E9E2D7;
  --line:#E3DACE; --line-strong:#C9BCA9;
  --ink:#241C18; --ink-2:#5A4C43; --ink-3:#8B7B6E;
  --accent:#A3123C; --accent-soft:#F7E3E9; --on-accent:#FFFFFF;
  --good:#1F6B4A; --good-soft:#E2F0E9;
  --warn:#9A5B06; --warn-soft:#FBEBD5;
  --display:"Karla",ui-sans-serif,system-ui,sans-serif;
  --body:"Karla",ui-sans-serif,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#15120F; --surface:#1E1A16; --surface-2:#272119; --surface-3:#322A21;
  --line:#352D24; --line-strong:#4B4035;
  --ink:#F3EDE5; --ink-2:#C3B6A8; --ink-3:#95877A;
  --accent:#F2456F; --accent-soft:#3A1722; --on-accent:#1B0A11;
  --good:#6FCFA2; --good-soft:#12291F;
  --warn:#E5A851; --warn-soft:#2E2113;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);
  padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}

.wrap{max-width:560px;margin:0 auto;padding-inline:16px}
.top{border-bottom:1px solid var(--line);padding-block:14px 12px}
.brand{display:flex;align-items:center;gap:8px;
  font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.01em}
.brand span{color:var(--accent)}

/* ------------------------------------------------------------------
   La marque. Le logotype est un SVG en ligne : aucune requete reseau,
   net a toute taille, et il prend les couleurs du theme tout seul.
   Le point du i est le signe de Lekk bi — plein au repos.
   ------------------------------------------------------------------ */
.brand .logo{width:86px;flex:none}
.logo{display:block;height:auto;width:100%;
  --logo-ink:var(--ink);--logo-accent:var(--accent)}
.when{font-size:12px;color:var(--ink-3);margin-top:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:14px}
.eyebrow{font-family:var(--display);font-size:12px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);margin:0 0 10px}
h1,h2{font-family:var(--display);font-weight:800;letter-spacing:-.015em;margin:0 0 4px;text-wrap:balance}
h1{font-size:22px} h2{font-size:16px}
.sub{font-size:14px;color:var(--ink-2);margin:0}
.note{font-size:12px;color:var(--ink-3);margin:10px 0 0}
.lab{display:block;font-size:14px;color:var(--ink-2);margin-top:12px}
.lab input,.lab select{display:block;width:100%;margin-top:5px;padding:11px;border:1.5px solid var(--line);
  border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
.lab input:focus,.lab select:focus{outline:none;border-color:var(--accent)}
.duo{display:flex;gap:10px}.duo .lab{flex:1}
.check{display:flex;align-items:flex-start;gap:9px;margin-top:11px;cursor:pointer}
.check input{margin:3px 0 0;width:17px;height:17px;flex:none;accent-color:var(--accent)}
.check b{display:block;font-size:14px;font-weight:600}
.check span{display:block;font-size:12px;color:var(--ink-3)}
.btn{display:block;width:100%;margin-top:14px;padding:13px;border:0;border-radius:10px;
  background:var(--accent);color:var(--on-accent);font-family:var(--display);font-weight:600;
  font-size:16px;cursor:pointer}
.btn:disabled{background:var(--surface-2);color:var(--ink-3);
  box-shadow:inset 0 0 0 1.5px var(--line);opacity:1;cursor:not-allowed}
.btn.ghost{background:none;color:var(--ink-2);border:1.5px solid var(--line)}
.btn.sm{padding:9px;font-size:14px;margin-top:8px}
.btn.danger{background:none;color:var(--accent);border:1.5px solid var(--accent)}
.tabs{display:flex;margin-top:14px;border-bottom:1px solid var(--line)}
.tab{flex:1;padding:11px 4px;border:0;background:none;color:var(--ink-3);font-family:var(--display);
  font-weight:600;font-size:14px;cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.jours{display:flex;gap:6px;margin-top:12px;overflow-x:auto;padding-bottom:3px}
.jour{flex:none;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;
  background:var(--surface);color:var(--ink-2);cursor:pointer;font-family:var(--body)}
.jour.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.jour b{font-weight:600}
.ligne{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}
.ligne:last-of-type{border-bottom:0}
.ligne .txt{flex:1;min-width:0}
.ligne .txt b{display:block;font-size:16px;font-weight:600;overflow-wrap:break-word}
.ligne .txt span{display:block;font-size:12px;color:var(--ink-3);overflow-wrap:break-word}
.ligne.off{opacity:.5}
.mod{flex:none;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);
  color:var(--ink-2);font-size:12px;padding:7px 11px;cursor:pointer;font-family:var(--body)}
.vide{font-size:14px;color:var(--ink-3);padding:18px 0;text-align:center}
.err{background:var(--surface-2);border:1px solid var(--accent);color:var(--ink);
  border-radius:10px;padding:11px 13px;font-size:14px;margin-top:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(14px);
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:14px;
  opacity:0;pointer-events:none;transition:.18s;max-width:90vw;text-align:center;z-index:30}
.toast.on{opacity:1;transform:translateX(-50%)}
/* la fiche d'édition, en panneau qui monte du bas : un pouce y arrive */
.voile{position:fixed;inset:0;background:rgba(20,15,12,.45);display:none;z-index:20}
.voile.on{display:block}
.panneau{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;z-index:21;
  background:var(--surface);border-radius:16px 16px 0 0;padding:20px 16px
  calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:.22s;
  max-width:560px;margin:0 auto}
.panneau.on{transform:translateY(0)}
.poignee{width:38px;height:4px;border-radius:99px;background:var(--line-strong);margin:0 auto 14px}
.lien{display:block;background:var(--surface-2);border-radius:10px;padding:11px 13px;margin-top:9px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;overflow-wrap:anywhere}
  /* `hidden` doit l'emporter : une règle de classe qui pose display (flex, block)
     bat l'attribut, et l'élément reste affiché alors qu'on le croit caché.
     C'est ce qui laissait un bandeau rose vide en haut du menu chaque matin,
     et le bouton « Changer ma commande » sur une commande déjà réglée. */
  [hidden]{display:none !important}

/* ------------------------------------------------------------------
   Garde-fou iOS — doit rester le DERNIER bloc de cette feuille.
   Safari iOS zoome la page des qu'on touche un champ dont la police
   calculee est sous 16 px. Les champs heritent de .lab, qui est a
   14 px : un selecteur « input » nu perd la bataille de specificite.
   D'ou les deux selecteurs, et la position en fin de feuille.
   Verifie en mesurant getComputedStyle(champ).fontSize, jamais la
   declaration : c'est le rendu qui zoome, pas le code.
   ------------------------------------------------------------------ */
input,select,textarea{font-size:16px}
.lab input,.lab select,.lab textarea{font-size:16px}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand"><svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2733 845" role="img" aria-label="Lekk bi"><g transform="translate(40,793) scale(1,-1)"><path fill="var(--logo-ink,#241C18)" d="M189 -5Q152 -5 121.0 10.0Q90 25 71.0 56.5Q52 88 52 141V681H197V193Q197 156 210.5 145.5Q224 135 245 135V0Q235 -2 218.5 -3.5Q202 -5 189 -5ZM538 -9Q465 -9 409.5 22.0Q354 53 323.5 110.0Q293 167 293 244Q293 320 323.5 378.0Q354 436 409.5 468.5Q465 501 538 501Q613 501 668.0 467.0Q723 433 753.0 375.5Q783 318 783 246Q783 233 782.0 221.0Q781 209 780 202H407V306H668L651 263Q651 318 623.5 353.0Q596 388 539 388Q488 388 457.5 357.0Q427 326 427 275V220Q427 165 458.5 134.5Q490 104 546 104Q593 104 620.5 123.0Q648 142 667 170L766 115Q734 56 676.0 23.5Q618 -9 538 -9ZM957 246V265L1157 489H1321L1099 238L1095 286L1326 0H1156ZM856 681H1001V0H856ZM1469 246V265L1669 489H1833L1611 238L1607 286L1838 0H1668ZM1368 681H1513V0H1368Z"/><path fill="var(--logo-accent,#A3123C)" d="M2151 -12Q2087 -12 2039.0 19.5Q1991 51 1964.5 108.5Q1938 166 1938 245Q1938 328 1964.0 385.0Q1990 442 2037.5 471.5Q2085 501 2150 501Q2216 501 2267.0 468.5Q2318 436 2347.0 378.0Q2376 320 2376 245Q2376 170 2347.5 111.5Q2319 53 2268.5 20.5Q2218 -12 2151 -12ZM1880 0V681H2026V353H2017V125H2026L1989 0ZM2123 125Q2168 125 2197.5 158.5Q2227 192 2227 245Q2227 297 2197.5 330.5Q2168 364 2123 364Q2079 364 2049.0 330.5Q2019 297 2019 245Q2019 192 2049.0 158.5Q2079 125 2123 125ZM2599 0H2453V489H2599Z"/><circle fill="var(--logo-accent,#A3123C)" cx="2526.0" cy="652.8" r="99.8"/></g></svg><span>·</span>mise en route</div>
    <div class="when" id="when">Chargement…</div>
  </div>

  <div id="err-box"></div>

  <!-- connexion -->
  <div class="card" id="s-login" hidden>
    <p class="eyebrow">Accès traiteur</p>
    <h1>Se connecter</h1>
    <p class="sub">Le même compte que l'écran de suivi.</p>
    <label class="lab" for="mail">Adresse e-mail<input type="email" id="mail" autocomplete="username" inputmode="email"></label>
    <label class="lab" for="mdp">Mot de passe<input type="password" id="mdp" autocomplete="current-password"></label>
    <button class="btn" id="go-login">Entrer</button>
  </div>

  <div id="s-app" hidden>
    <div class="tabs">
      <button class="tab on" data-v="menu">Menu</button>
      <button class="tab" data-v="rubriques">Rubriques</button>
      <button class="tab" data-v="reglages">Réglages</button>
    </div>
    <div id="v-menu"></div>
    <div id="v-rubriques" hidden></div>
    <div id="v-reglages" hidden></div>
    <button class="btn ghost sm" id="go-out">Se déconnecter</button>
  </div>

</div>

<div class="voile" id="voile"></div>
<div class="panneau" id="panneau"><div class="poignee"></div><div id="panneau-corps"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ===================================================================
   CONFIGURATION — les mêmes deux lignes que les autres pages
   =================================================================== */
var CONFIG = {
  url: "https://fiqrfrcsgxqvqjgvzasr.supabase.co",
  cle: "sb_publishable_yAowOWU05DlJ_xQXU0vQ0A_bk6O23ht"
};
/* =================================================================== */

(function(){
  "use strict";
  var $ = function(i){ return document.getElementById(i); };
  var fcfa = function(n){ return (n||0).toLocaleString("fr-FR").replace(/ | /g," ") + " F"; };
  var JOURS = ["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];
  var COURT = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];

  var JETON = null, RAFRAICHIR = null, CONF = null, VUE = "menu", JOUR = 1;

  try {
    JETON = localStorage.getItem("dema_jeton");
    RAFRAICHIR = localStorage.getItem("dema_rafraichir");
  } catch(e){}
  function garder(d){
    JETON = d.access_token; RAFRAICHIR = d.refresh_token;
    try { localStorage.setItem("dema_jeton", JETON);
          localStorage.setItem("dema_rafraichir", RAFRAICHIR || ""); } catch(e){}
  }
  function oublier(){
    JETON = null; RAFRAICHIR = null;
    try { localStorage.removeItem("dema_jeton"); localStorage.removeItem("dema_rafraichir"); } catch(e){}
  }

  var tT = null;
  function toast(t){
    var el = $("toast"); el.textContent = t; el.classList.add("on");
    clearTimeout(tT); tT = setTimeout(function(){ el.classList.remove("on"); }, 2800);
  }
  function erreur(m){
    var b = $("err-box"); b.innerHTML = "";
    if(!m) return;
    var d = document.createElement("div"); d.className = "err"; d.textContent = m;
    b.appendChild(d); window.scrollTo(0,0);
  }

  function rafraichir(){
    if(!RAFRAICHIR) return Promise.reject(new Error("session expirée"));
    return fetch(CONFIG.url + "/auth/v1/token?grant_type=refresh_token", {
      method:"POST", headers:{ "apikey": CONFIG.cle, "Content-Type":"application/json" },
      body: JSON.stringify({ refresh_token: RAFRAICHIR })
    }).then(function(r){ return r.json().then(function(d){
        if(!r.ok || !d.access_token) throw new Error("session expirée");
        garder(d); return d; }); });
  }
  function rpc(fn, args, reessai){
    return fetch(CONFIG.url + "/rest/v1/rpc/" + fn, {
      method:"POST",
      headers:{ "apikey": CONFIG.cle, "Authorization":"Bearer " + JETON,
                "Content-Type":"application/json" },
      body: JSON.stringify(args || {})
    }).then(function(r){
      if((r.status === 401 || r.status === 403) && !reessai && RAFRAICHIR)
        return rafraichir().then(function(){ return rpc(fn, args, true); });
      return r.text().then(function(txt){
        var d = null;
        try { d = txt ? JSON.parse(txt) : null; } catch(e){ d = txt; }
        if(!r.ok) throw new Error(String((d && (d.message || d.hint || d.details))
                      || ("Erreur " + r.status)).replace(/^(ERREUR|ERROR):\s*/i, ""));
        return d;
      });
    });
  }

  /* ---------- panneau d'édition ---------- */
  function ouvrir(corps){
    $("panneau-corps").innerHTML = ""; $("panneau-corps").appendChild(corps);
    $("voile").classList.add("on"); $("panneau").classList.add("on");
  }
  function fermer(){
    $("voile").classList.remove("on"); $("panneau").classList.remove("on");
  }
  $("voile").addEventListener("click", fermer);

  function champ(id, lib, val, type, place){
    var l = document.createElement("label"); l.className = "lab"; l.textContent = lib;
    var i = document.createElement("input"); i.id = id; i.type = type || "text";
    if(type === "number") i.inputMode = "numeric";
    i.value = (val === null || val === undefined) ? "" : val;
    if(place) i.placeholder = place;
    l.appendChild(i); return l;
  }
  function coche(id, titre, expl, val){
    var l = document.createElement("label"); l.className = "check";
    var i = document.createElement("input"); i.type = "checkbox"; i.id = id; i.checked = !!val;
    var d = document.createElement("div");
    d.innerHTML = "<b></b><span></span>";
    d.children[0].textContent = titre; d.children[1].textContent = expl;
    l.appendChild(i); l.appendChild(d); return l;
  }
  function titre(t, s){
    var d = document.createElement("div");
    var h = document.createElement("h2"); h.textContent = t; d.appendChild(h);
    if(s){ var p = document.createElement("p"); p.className = "sub"; p.textContent = s; d.appendChild(p); }
    return d;
  }
  function vnum(id){
    var v = ($(id).value || "").trim();
    return v === "" ? null : parseInt(v, 10);
  }

  /* ---------- chargement ---------- */
  function charger(){
    erreur(null);
    return rpc("fn_config").then(function(c){
      CONF = c;
      $("when").textContent = c.traiteur;
      rendre();
      $("s-login").hidden = true; $("s-app").hidden = false;
    }).catch(function(e){
      if(/session expirée/i.test(e.message)){ oublier(); demarrer(); return; }
      erreur(e.message);
      if(!CONF){ $("s-app").hidden = true; $("s-login").hidden = false; $("when").textContent = "—"; }
    });
  }

  function rendre(){
    menu(); rubriques(); reglages();
    ["menu","rubriques","reglages"].forEach(function(v){
      $("v-"+v).hidden = (v !== VUE);
      var t = document.querySelector('.tab[data-v="'+v+'"]');
      if(t) t.classList.toggle("on", v === VUE);
    });
  }

  /* ---------- onglet MENU ---------- */
  function menu(){
    var box = $("v-menu"); box.innerHTML = "";
    var parJour = (CONF.rubriques||[]).filter(function(r){ return r.par_jour; });
    var fixes   = (CONF.rubriques||[]).filter(function(r){ return !r.par_jour; });

    if(parJour.length){
      var bar = document.createElement("div"); bar.className = "jours";
      for(var j = 1; j <= 7; j++){
        (function(j){
          var n = 0;
          parJour.forEach(function(r){ r.articles.forEach(function(a){
            if(a.jour === j && a.actif) n++; }); });
          var b = document.createElement("button");
          b.className = "jour" + (JOUR === j ? " on" : "");
          b.innerHTML = "<b></b>";
          b.children[0].textContent = COURT[j-1] + (n ? " · " + n : "");
          b.addEventListener("click", function(){ JOUR = j; rendre(); });
          bar.appendChild(b);
          // vendredi est loin à droite sur un écran de téléphone : on l'amène à vue
          if(JOUR === j) setTimeout(function(){
            try { b.scrollIntoView({ block:"nearest", inline:"center" }); } catch(e){}
          }, 0);
        })(j);
      }
      box.appendChild(bar);
    }

    parJour.forEach(function(r){
      box.appendChild(carteRubrique(r, JOUR));
    });
    fixes.forEach(function(r){
      box.appendChild(carteRubrique(r, null));
    });

    if(!(CONF.rubriques||[]).length){
      var v = document.createElement("div"); v.className = "card";
      v.innerHTML = '<p class="vide">Aucune rubrique. Commence par l\'onglet « Rubriques ».</p>';
      box.appendChild(v);
    }
  }

  function carteRubrique(r, jour){
    var c = document.createElement("div"); c.className = "card";
    var e = document.createElement("p"); e.className = "eyebrow";
    e.textContent = r.nom + (jour ? " · " + JOURS[jour-1] : " · tous les jours");
    c.appendChild(e);

    var liste = r.articles.filter(function(a){ return jour ? a.jour === jour : true; });
    if(!liste.length){
      var v = document.createElement("p"); v.className = "vide";
      v.textContent = jour ? "Rien pour ce jour." : "Rien dans cette rubrique.";
      c.appendChild(v);
    }
    liste.forEach(function(a){
      var li = document.createElement("div"); li.className = "ligne" + (a.actif ? "" : " off");
      var t = document.createElement("div"); t.className = "txt";
      t.innerHTML = "<b></b><span></span>";
      t.children[0].textContent = a.nom;
      var d = [r.offert ? "offert" : fcfa(a.prix)];
      if(a.limite) d.push("limite " + a.limite);
      if(!a.actif) d.push("retiré du menu");
      t.children[1].textContent = d.join(" · ");
      var m = document.createElement("button"); m.className = "mod"; m.textContent = "Modifier";
      m.addEventListener("click", function(){ ficheArticle(r, a, jour); });
      li.appendChild(t); li.appendChild(m); c.appendChild(li);
    });

    var b = document.createElement("button"); b.className = "btn ghost sm";
    b.textContent = "Ajouter " + (jour ? "un plat pour " + JOURS[jour-1] : "dans « " + r.nom + " »");
    b.addEventListener("click", function(){ ficheArticle(r, null, jour); });
    c.appendChild(b);
    return c;
  }

  function ficheArticle(r, a, jour){
    var f = document.createElement("div");
    f.appendChild(titre(a ? "Modifier" : "Nouveau",
      r.nom + (jour ? " · " + JOURS[jour-1] : "")));
    f.appendChild(champ("f-nom", "Nom du plat", a ? a.nom : "", "text", "Yassa poulet khew"));
    if(!r.offert) f.appendChild(champ("f-prix", "Prix en francs", a ? a.prix : "", "number", "3000"));
    f.appendChild(champ("f-lim", "Limite de portions (facultatif)",
      a && a.limite ? a.limite : "", "number", "laisser vide = illimité"));
    if(a) f.appendChild(coche("f-actif", "Au menu", "Décoche pour le retirer sans l'effacer", a.actif));

    var ok = document.createElement("button"); ok.className = "btn"; ok.textContent = "Enregistrer";
    ok.addEventListener("click", function(){
      var args = {
        p_id: a ? a.id : null, p_rubrique: r.id,
        p_nom: $("f-nom").value,
        p_prix: r.offert ? 0 : vnum("f-prix"),
        p_jour: r.par_jour ? jour : null,
        p_limite: vnum("f-lim"), p_ordre: null,
        p_actif: a ? $("f-actif").checked : true
      };
      ok.disabled = true; ok.textContent = "…";
      rpc("fn_article_maj", args).then(function(){
        fermer(); toast(a ? "Modifié" : "Ajouté"); return charger();
      }).catch(function(e){ toast(e.message); ok.disabled = false; ok.textContent = "Enregistrer"; });
    });
    f.appendChild(ok);

    if(a){
      var sup = document.createElement("button"); sup.className = "btn danger sm";
      sup.textContent = a.engage ? "Retirer du menu" : "Supprimer";
      sup.addEventListener("click", function(){
        sup.disabled = true;
        rpc("fn_article_suppr", { p_id: a.id }).then(function(m){
          fermer(); toast(String(m)); return charger();
        }).catch(function(e){ toast(e.message); sup.disabled = false; });
      });
      f.appendChild(sup);
      if(a.engage){
        var n = document.createElement("p"); n.className = "note";
        n.textContent = "Ce plat a déjà été commandé : il sera retiré du menu, pas effacé, "
                      + "pour que les commandes passées restent lisibles.";
        f.appendChild(n);
      }
    }
    var an = document.createElement("button"); an.className = "btn ghost sm";
    an.textContent = "Annuler"; an.addEventListener("click", fermer);
    f.appendChild(an);
    ouvrir(f);
  }

  /* ---------- onglet RUBRIQUES ---------- */
  function rubriques(){
    var box = $("v-rubriques"); box.innerHTML = "";
    var c = document.createElement("div"); c.className = "card";
    var e = document.createElement("p"); e.className = "eyebrow"; e.textContent = "Rubriques du menu";
    c.appendChild(e);
    var s = document.createElement("p"); s.className = "sub";
    s.textContent = "Les familles de ton menu : les plats, les jus, les desserts… "
                  + "Chacune a ses règles.";
    c.appendChild(s);

    (CONF.rubriques||[]).forEach(function(r){
      var li = document.createElement("div"); li.className = "ligne";
      var t = document.createElement("div"); t.className = "txt";
      t.innerHTML = "<b></b><span></span>";
      t.children[0].textContent = r.nom;
      var d = [r.mode === "unique" ? "un seul choix" : "plusieurs choix"];
      if(r.obligatoire) d.push("obligatoire");
      if(r.quantite) d.push("quantités");
      if(r.par_jour) d.push("change chaque jour");
      if(r.offert) d.push("offert");
      d.push(r.articles.length + (r.articles.length > 1 ? " plats" : " plat"));
      t.children[1].textContent = d.join(" · ");
      var m = document.createElement("button"); m.className = "mod"; m.textContent = "Modifier";
      m.addEventListener("click", function(){ ficheRubrique(r); });
      li.appendChild(t); li.appendChild(m); c.appendChild(li);
    });

    var b = document.createElement("button"); b.className = "btn ghost sm";
    b.textContent = "Ajouter une rubrique";
    b.addEventListener("click", function(){ ficheRubrique(null); });
    c.appendChild(b);
    box.appendChild(c);
  }

  function ficheRubrique(r){
    var f = document.createElement("div");
    f.appendChild(titre(r ? "Modifier la rubrique" : "Nouvelle rubrique",
      "Les réglages valent pour tous les plats qu'elle contient."));
    f.appendChild(champ("f-nom", "Nom", r ? r.nom : "", "text", "Jus, Dessert, Plats du jour…"));

    var l = document.createElement("label"); l.className = "lab"; l.textContent = "Choix possible";
    var sel = document.createElement("select"); sel.id = "f-mode";
    [["unique","Un seul — comme le plat du jour"],
     ["multiple","Plusieurs — on peut en prendre deux"]].forEach(function(o){
      var op = document.createElement("option"); op.value = o[0]; op.textContent = o[1];
      if(r && r.mode === o[0]) op.selected = true;
      sel.appendChild(op);
    });
    l.appendChild(sel); f.appendChild(l);

    f.appendChild(coche("f-obl", "Obligatoire",
      "On ne valide pas une commande sans y avoir choisi quelque chose", r ? r.obligatoire : false));
    f.appendChild(coche("f-qte", "Plusieurs portions",
      "Permet de commander deux fois le même article", r ? r.quantite : false));
    f.appendChild(coche("f-pj", "Change chaque jour",
      "Chaque plat est rattaché à un jour de la semaine", r ? r.par_jour : false));
    f.appendChild(coche("f-off", "Offert",
      "Compté à zéro franc, sans prix à saisir", r ? r.offert : false));

    var ok = document.createElement("button"); ok.className = "btn"; ok.textContent = "Enregistrer";
    ok.addEventListener("click", function(){
      ok.disabled = true; ok.textContent = "…";
      rpc("fn_rubrique_maj", {
        p_id: r ? r.id : null, p_nom: $("f-nom").value, p_mode: $("f-mode").value,
        p_obligatoire: $("f-obl").checked, p_quantite: $("f-qte").checked,
        p_par_jour: $("f-pj").checked, p_offert: $("f-off").checked, p_ordre: null
      }).then(function(){ fermer(); toast(r ? "Modifiée" : "Ajoutée"); return charger(); })
       .catch(function(e){ toast(e.message); ok.disabled = false; ok.textContent = "Enregistrer"; });
    });
    f.appendChild(ok);

    if(r){
      var sup = document.createElement("button"); sup.className = "btn danger sm";
      sup.textContent = "Supprimer la rubrique";
      sup.addEventListener("click", function(){
        sup.disabled = true;
        rpc("fn_rubrique_suppr", { p_id: r.id }).then(function(m){
          fermer(); toast("Rubrique " + m); return charger();
        }).catch(function(e){ toast(e.message); sup.disabled = false; });
      });
      f.appendChild(sup);
    }
    var an = document.createElement("button"); an.className = "btn ghost sm";
    an.textContent = "Annuler"; an.addEventListener("click", fermer);
    f.appendChild(an);
    ouvrir(f);
  }

  /* ---------- onglet RÉGLAGES ---------- */
  function reglages(){
    var box = $("v-reglages"); box.innerHTML = "";

    var c1 = document.createElement("div"); c1.className = "card";
    var e1 = document.createElement("p"); e1.className = "eyebrow";
    e1.textContent = "Entreprises servies"; c1.appendChild(e1);
    var s1 = document.createElement("p"); s1.className = "sub";
    s1.textContent = "Une entreprise, un lien. C'est le lien qui dit d'où vient la commande.";
    c1.appendChild(s1);
    (CONF.sites||[]).forEach(function(s){
      var li = document.createElement("div"); li.className = "ligne" + (s.actif ? "" : " off");
      var t = document.createElement("div"); t.className = "txt";
      t.innerHTML = "<b></b><span></span>";
      t.children[0].textContent = s.nom;
      t.children[1].textContent = "clôture " + s.cloture + " · ?s=" + s.slug
                                + (s.actif ? "" : " · suspendue");
      var m = document.createElement("button"); m.className = "mod"; m.textContent = "Modifier";
      m.addEventListener("click", function(){ ficheSite(s); });
      li.appendChild(t); li.appendChild(m); c1.appendChild(li);
    });
    var b1 = document.createElement("button"); b1.className = "btn ghost sm";
    b1.textContent = "Ajouter une entreprise";
    b1.addEventListener("click", function(){ ficheSite(null); });
    c1.appendChild(b1);
    box.appendChild(c1);

    var c2 = document.createElement("div"); c2.className = "card";
    var e2 = document.createElement("p"); e2.className = "eyebrow";
    e2.textContent = "Moyens de paiement"; c2.appendChild(e2);
    var s2 = document.createElement("p"); s2.className = "sub";
    s2.textContent = "Le numéro affiché aux employés au moment de régler.";
    c2.appendChild(s2);
    (CONF.moyens||[]).forEach(function(m){
      var li = document.createElement("div"); li.className = "ligne" + (m.actif ? "" : " off");
      var t = document.createElement("div"); t.className = "txt";
      t.innerHTML = "<b></b><span></span>";
      t.children[0].textContent = m.nom;
      t.children[1].textContent = (m.numero || "sans numéro") + (m.actif ? "" : " · désactivé");
      var mo = document.createElement("button"); mo.className = "mod"; mo.textContent = "Modifier";
      mo.addEventListener("click", function(){ ficheMoyen(m); });
      li.appendChild(t); li.appendChild(mo); c2.appendChild(li);
    });
    var b2 = document.createElement("button"); b2.className = "btn ghost sm";
    b2.textContent = "Ajouter un moyen de paiement";
    b2.addEventListener("click", function(){ ficheMoyen(null); });
    c2.appendChild(b2);
    box.appendChild(c2);
  }

  function ficheSite(s){
    var f = document.createElement("div");
    f.appendChild(titre(s ? "Modifier l'entreprise" : "Nouvelle entreprise",
      "L'heure de clôture ferme les commandes du jour."));
    f.appendChild(champ("f-nom", "Nom", s ? s.nom : "", "text", "Yas"));
    f.appendChild(champ("f-clo", "Clôture des commandes", s ? s.cloture : "10:30", "text", "10:30"));
    if(s) f.appendChild(coche("f-actif", "En service",
      "Décoche pour suspendre sans effacer", s.actif));
    if(s){
      var p = document.createElement("p"); p.className = "note";
      p.textContent = "Le lien à envoyer dans le groupe WhatsApp :";
      var l = document.createElement("div"); l.className = "lien";
      l.textContent = location.origin + location.pathname.replace(/[^\/]*$/, "")
                    + "?s=" + s.slug;
      f.appendChild(p); f.appendChild(l);
    }
    var ok = document.createElement("button"); ok.className = "btn"; ok.textContent = "Enregistrer";
    ok.addEventListener("click", function(){
      ok.disabled = true; ok.textContent = "…";
      rpc("fn_site_maj", { p_id: s ? s.id : null, p_nom: $("f-nom").value,
        p_slug: null, p_cloture: $("f-clo").value,
        p_actif: s ? $("f-actif").checked : true })
        .then(function(){ fermer(); toast(s ? "Modifiée" : "Ajoutée"); return charger(); })
        .catch(function(e){ toast(e.message); ok.disabled = false; ok.textContent = "Enregistrer"; });
    });
    f.appendChild(ok);
    var an = document.createElement("button"); an.className = "btn ghost sm";
    an.textContent = "Annuler"; an.addEventListener("click", fermer);
    f.appendChild(an);
    ouvrir(f);
  }

  function ficheMoyen(m){
    var f = document.createElement("div");
    f.appendChild(titre(m ? "Modifier" : "Nouveau moyen de paiement",
      "Wave, Orange Money, Mix, espèces…"));
    f.appendChild(champ("f-nom", "Nom", m ? m.nom : "", "text", "Wave"));
    f.appendChild(champ("f-num", "Numéro à afficher", m ? (m.numero || "") : "", "text", "76 882 03 12"));
    if(m) f.appendChild(coche("f-actif", "Proposé aux employés",
      "Décoche pour le retirer du choix", m.actif));
    var ok = document.createElement("button"); ok.className = "btn"; ok.textContent = "Enregistrer";
    ok.addEventListener("click", function(){
      ok.disabled = true; ok.textContent = "…";
      rpc("fn_moyen_maj", { p_id: m ? m.id : null, p_code: m ? m.code : null,
        p_nom: $("f-nom").value, p_numero: $("f-num").value,
        p_actif: m ? $("f-actif").checked : true, p_ordre: null })
        .then(function(){ fermer(); toast(m ? "Modifié" : "Ajouté"); return charger(); })
        .catch(function(e){ toast(e.message); ok.disabled = false; ok.textContent = "Enregistrer"; });
    });
    f.appendChild(ok);
    var an = document.createElement("button"); an.className = "btn ghost sm";
    an.textContent = "Annuler"; an.addEventListener("click", fermer);
    f.appendChild(an);
    ouvrir(f);
  }

  /* ---------- actions ---------- */
  $("go-login").addEventListener("click", function(){
    var m = $("mail").value.trim(), p = $("mdp").value;
    if(!m || !p){ toast("Adresse et mot de passe"); return; }
    erreur(null); this.disabled = true; this.textContent = "Connexion…";
    var self = this;
    fetch(CONFIG.url + "/auth/v1/token?grant_type=password", {
      method:"POST", headers:{ "apikey": CONFIG.cle, "Content-Type":"application/json" },
      body: JSON.stringify({ email: m, password: p })
    }).then(function(r){ return r.json().then(function(d){
        if(!r.ok || !d.access_token)
          throw new Error(d.error_description || d.msg || d.message || "Connexion refusée");
        garder(d); $("mdp").value = ""; return charger(); }); })
      .catch(function(e){ erreur(e.message); })
      .then(function(){ self.disabled = false; self.textContent = "Entrer"; });
  });
  $("go-out").addEventListener("click", function(){
    oublier(); CONF = null; $("s-app").hidden = true; $("s-login").hidden = false;
    $("when").textContent = "—";
  });
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(t){
    t.addEventListener("click", function(){ VUE = t.getAttribute("data-v"); rendre(); });
  });

  function demarrer(){
    // le jour proposé est celui d'aujourd'hui, à l'heure de Dakar
    var d = new Date(new Date().toLocaleString("en-US", { timeZone:"Africa/Dakar" }));
    JOUR = d.getDay() === 0 ? 7 : d.getDay();
    if(!JETON){ $("s-app").hidden = true; $("s-login").hidden = false; $("when").textContent = "—"; return; }
    charger();
  }
  demarrer();
})();
</script>
</body>
</html>
